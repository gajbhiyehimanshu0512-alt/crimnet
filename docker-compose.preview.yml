services:
  neo4j:
    image: neo4j:5.18-community
    container_name: cna_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/cna_password123"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "256m"
      NEO4J_dbms_memory_heap_max__size: "1G"
    volumes:
      - neo4j_data:/data
    networks:
      - cna_net
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: cna_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cna_user
      POSTGRES_PASSWORD: cna_pass
      POSTGRES_DB: criminal_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cna_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cna_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cna_redis
    ports:
      - "6379:6379"
    networks:
      - cna_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  chromadb:
    image: chromadb/chroma:latest
    container_name: cna_chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - cna_net
    environment:
      ALLOW_RESET: "true"
      ANONYMIZED_TELEMETRY: "false"

  ollama:
    image: ollama/ollama:latest
    container_name: cna_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - cna_net
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cna_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: cna_password123
      POSTGRES_URL: postgresql://cna_user:[REDACTED]@postgres:5432/criminal_network
      REDIS_URL: redis://redis:6379
      CHROMA_URL: http://chromadb:8000
      OLLAMA_URL: http://ollama:11434
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
      ollama:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploaded_files:/app/uploads
    networks:
      - cna_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cna_frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    networks:
      - cna_net

volumes:
  neo4j_data:
  postgres_data:
  chroma_data:
  uploaded_files:
  ollama_data:

networks:
  cna_net:
    driver: bridge
